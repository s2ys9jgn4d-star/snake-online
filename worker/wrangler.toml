name = "snake-online"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# 单个 Durable Object 承载全部游戏世界（房间都在内存里，和 Node 版一致）
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# 免费计划只能使用 SQLite 版 Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# 静态页面直接用 ../dist 里现成的那套，和 Node 版同一份文件
[vars]
# 对外地址：OAuth 回调必须和 Google 控制台里登记的一致
SITE_ORIGIN = "https://snakes-online.pages.dev"

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true
# 保持和 Node 版一样的 URL 写法：/play.html 直接给文件，不跳成 /play
html_handling = "none"
